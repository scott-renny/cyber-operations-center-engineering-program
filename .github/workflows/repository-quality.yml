name: Repository guardrails

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository baseline
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
      - name: Detect accidentally committed secrets
        shell: bash
        run: |
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}' -- .; then
            echo "Potential secret material detected."
            exit 1
          fi
